<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>MFkin Analyser</title>
    <meta
      name="description"
      content="Rank Indian mutual funds by sector: leaders over 1, 3 and 5 years, AUM, expense ratios and risk ratios side by side."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the saved theme before the first paint, so a dark theme never flashes light.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "funky") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
